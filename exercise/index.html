<!DOCTYPE html>
<html lang="en">
<head>
    <title>EduLearn - Unlock Your Potential</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="landing-page">
        <div class="left">
            <p class="welcome-tag">
                 Welcome to EduLearn
            </p>
            <h1>Unlock Your Potential with Quality Education</h1>
            <p class="tagline">
                Learn from the best instructors and advance your career with our comprehensive online courses designed for your success.
            </p>
            <div class="cta-buttons">
                <button class="btn btn-primary">Get Started</button>
                <button class="btn btn-secondary">
                    <span class="icon">▶</span> Watch Demo
                </button>
            </div>
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-number">50K+</span>
                    <span class="stat-label">Students</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number">200+</span>
                    <span class="stat-label">Courses</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number">95%</span>
                    <span class="stat-label">Success Rate</span>
                </div>
            </div>
        </div>
        <div class="right">
            <img src="photo.jpeg" alt="Students and instructor in a classroom setting" class="main-image">
        </div>
    </div>
</body>
</html>
